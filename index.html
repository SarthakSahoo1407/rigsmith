<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rig</title>
    <style>
      :root { color-scheme: dark; --bg: #16161a; --panel: #222228; --line: #3a3a44; --fg: #e8e8ec; --dim: #9a9aa6; --ok: #4ade80; --warn: #facc15; --bad: #ef4444; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      main { max-width: 520px; margin: 40px auto; padding: 0 16px; display: grid; gap: 16px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; }
      h2 { margin: 0; font-size: 13px; color: var(--dim); font-weight: 600; }
      label { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; }
      select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
      button { cursor: pointer; }
      .meter { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
      .meter > div { height: 100%; background: var(--ok); }
      .led { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
      .led.on { background: var(--bad); }
      .banner { background: var(--warn); color: #000; padding: 10px 16px; border-radius: 8px; }
      .error { color: var(--bad); }
      .dim { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
