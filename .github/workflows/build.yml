# Builds Rigsmith on macOS and Windows, runs the UI tests and the audio engine checks, and makes an
# installer for each: Rigsmith-Setup-Windows.exe and Rigsmith-macOS.pkg. Pushing a tag like v1.0.0
# publishes them as a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # The Mac build is the slow one (about an hour from scratch), so it runs for releases (a v* tag),
      # pull requests and manual runs; every push to main builds Windows only.
      matrix: ${{ fromJSON(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && '{"include":[{"os":"windows-2022","name":"Windows","targets":"Rig RigCheck RigUi RigPlugin_VST3 RigPluginUi"}]}' || '{"include":[{"os":"macos-latest","name":"macOS","targets":"Rig RigCheck RigUi RigPlugin_VST3 RigPlugin_AU RigPluginInstall"},{"os":"windows-2022","name":"Windows","targets":"Rig RigCheck RigUi RigPlugin_VST3 RigPluginUi"}]}') }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Version
        id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/v*) echo "version=${tag#v}" >> "$GITHUB_OUTPUT" ;; *) echo "version=0.0.0" >> "$GITHUB_OUTPUT" ;; esac
      # Compiler cache: JUCE and the NAM core are the same every build, so only the first build is slow.
      - uses: hendrikmuhs/ccache-action@v1.2
        if: runner.os == 'macOS'
        with: { key: "ccache-${{ matrix.os }}", max-size: 1G }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache"; fi
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release $extra
      - name: Build
        run: cmake --build native/build --config Release --parallel --target ${{ matrix.targets }}
      - name: Audio engine checks
        shell: bash
        run: |
          check=$(find native/build -name 'RigCheck*' -type f -perm -u+x | grep -v '\.dir' | head -1)
          [ -n "$check" ] || check=native/build/RigCheck_artefacts/Release/RigCheck.exe
          "$check"

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist-app
          cp -r native/build/Rig_artefacts/Release/. dist-app/
          cp -r native/build/RigPlugin_artefacts/Release/VST3 dist-app/VST3
          choco install innosetup -y --no-progress
          # Git Bash rewrites arguments that start with "/" into Windows paths; ISCC's switches must stay as typed.
          export MSYS_NO_PATHCONV=1
          here="$(pwd -W)"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" "/DAppDir=$here\\dist-app" "/O$here\\out" installer/windows/Rigsmith.iss
      - name: macOS installer
        if: runner.os == 'macOS'
        run: installer/macos/build-pkg.sh "${{ steps.v.outputs.version }}" native/build out

      - uses: actions/upload-artifact@v4
        with: { name: "installer-${{ matrix.name }}", path: out/*, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: installer-*, path: installers, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Rigsmith ${GITHUB_REF_NAME#v}" --generate-notes
