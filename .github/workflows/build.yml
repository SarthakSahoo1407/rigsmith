# Builds Rigsmith on macOS and Windows, runs the UI tests and the audio engine checks, and makes an
# installer for each: Rigsmith-Setup-Windows.exe and Rigsmith-macOS.pkg. Pushing a tag like v1.0.0
# publishes them as a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Version
        id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/v*) echo "version=${tag#v}" >> "$GITHUB_OUTPUT" ;; *) echo "version=0.0.0" >> "$GITHUB_OUTPUT" ;; esac
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --config Release --parallel
      - name: Audio engine checks
        shell: bash
        run: |
          check=$(find native/build -name 'RigCheck*' -type f -perm -u+x | grep -v '\.dir' | head -1)
          [ -n "$check" ] || check=native/build/RigCheck_artefacts/Release/RigCheck.exe
          "$check"

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist-app
          cp -r native/build/Rig_artefacts/Release/. dist-app/
          cp -r native/build/RigPlugin_artefacts/Release/VST3 dist-app/VST3
          choco install innosetup -y --no-progress
          # Git Bash rewrites arguments that start with "/" into Windows paths; ISCC's switches must stay as typed.
          export MSYS_NO_PATHCONV=1
          here="$(pwd -W)"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" "/DAppDir=$here\\dist-app" "/O$here\\out" installer/windows/Rigsmith.iss
      - name: macOS installer
        if: runner.os == 'macOS'
        run: installer/macos/build-pkg.sh "${{ steps.v.outputs.version }}" native/build out

      - uses: actions/upload-artifact@v4
        with: { name: "installer-${{ matrix.name }}", path: out/*, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: installer-*, path: installers, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Rigsmith ${GITHUB_REF_NAME#v}" --generate-notes
